# Dependabot version-update configuration. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The Deno dependency manifest and lockfile live under prototype/, not the
  # repo root (whose deno.json declares only deno tasks, no imports).
  - package-ecosystem: "deno"
    directory: "/prototype"
    schedule:
      interval: "weekly"
  # The Rust substrate's crates are declared in core/Cargo.toml and locked by
  # the committed core/Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
  # Workflow actions are pinned by full commit digest; this lane proposes
  # digest updates so pins do not silently rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# Not Dependabot-covered, and therefore moved only by manual operator
# inspect-before-apply: the Rust toolchain channel in
# core/rust-toolchain.toml, and the exact Deno/Dolt archive versions plus
# their committed SHA-256 digests in .github/workflows/gate.yml. Nothing in
# the gate flags those pins when they age; see README "Dependency updates".
