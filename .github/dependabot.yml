# Dependabot version-update configuration. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The npm lane declares a cooldown of 3 days, the 72-hour registry
# release-age floor that the root .npmrc (`min-release-age`) and the
# dependency policy hold, so a bot pull request never proposes a release
# younger than an install would accept. Dependabot's own default is also 3
# days; declaring it keeps the floor from resting on an upstream default.
# Cooldown applies to version updates only, not security updates.
# `npm test` (dependency.policy) checks these lanes.

version: 2
updates:
  # One npm workspace at the repository root: the runtime packages are
  # declared in prototype/package.json (a workspace member) and the tooling
  # devDependencies in the root package.json, all pinned exactly and locked
  # by the root package-lock.json. The root lane updates the members too.
  # typescript (7.x, the native compiler) ships its binary through
  # per-platform optional packages (@typescript/typescript-<os>-<arch>) that
  # the lock pins with integrity hashes; a bump moves them together.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # `increase` rewrites an exact pin to the new exact version, so a bot
    # pull request keeps the dependency policy's exact-pin rule.
    versioning-strategy: "increase"
    cooldown:
      default-days: 3
    # The codex-chatgpt runner asserts an exact adapter version at launch
    # (CODEX_ACP_VERSION in prototype/src/external-agent-runtime.ts) and two
    # test fixtures pin the same string, so a bot bump of this package cannot
    # pass the gate. External-agent (ACP) work is deferred; the adapter is
    # upgraded deliberately, with the pin and fixtures, when that resumes.
    ignore:
      - dependency-name: "@agentclientprotocol/codex-acp"
  # The Rust substrate's crates are declared in core/Cargo.toml and locked by
  # the committed core/Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
  # Workflow actions are pinned by full commit digest; this lane proposes
  # digest updates so pins do not silently rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# Not Dependabot-covered: the Rust toolchain channel in
# core/rust-toolchain.toml, the exact Node version in .node-version, and the
# exact Dolt archive versions plus their committed SHA-256 digests in
# .github/workflows/gate.yml. Applying a
# change to those is intended to be a manual, operator-inspected step; this
# config enforces neither the inspection nor who may change them. Nothing in
# the gate flags those pins when they age; see README "Dependency updates".
