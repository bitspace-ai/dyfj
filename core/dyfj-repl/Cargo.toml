[package]
name = "dyfj-repl"
version = "0.0.1"
edition = "2024"
description = "DYFJ interactive REPL front-end — owns the terminal, speaks the Workbench UDS protocol"
license = "MIT"
repository = "https://github.com/bitspace-ai/dyfj"

[dependencies]
anyhow = "1.0.102"
libc = "0.2.189"
rustyline = "18.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
uuid = { version = "1.26.1", features = ["v4"] }
