[package]
name = "dyfj-sandbox"
version = "0.0.1"
edition = "2024"
description = "DYFJ isolated-machine launcher: applies a Linux launch plan (nftables, uid drop, bubblewrap, Landlock) and supervises the executor's lease"
license = "MIT"
repository = "https://github.com/bitspace-ai/dyfj"

# Only crates the workspace already locks, at the versions dyfj-repl uses.
[dependencies]
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
