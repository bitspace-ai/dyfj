[package]
name = "dyfj-core"
# Several default members means several binaries, so a bare `cargo run` here would be
# ambiguous. Name the one the README's quick start documents.
default-run = "dyfj-core"
version = "0.0.1"
edition = "2024"
description = "DYFJ substrate — Rust core for a sovereign personal AI stack"
license = "MIT"
repository = "https://github.com/bitspace-ai/dyfj"
readme = "README.md"

# core/ is both a package and the workspace root. Keeping the existing package
# in place avoids moving files and leaves every path that references core/
# unchanged, including the aggregate gate's `cargo test` in this directory.
#
# default-members is explicit: a root package would otherwise be the only
# default, and the gate would silently stop covering the other members.
[workspace]
members = [".", "dyfj-repl", "dyfj-sandbox"]
# Every member is default so `cargo test` and `cargo build` here cover the
# workspace; the gate runs `cargo test` in this directory and would otherwise
# silently stop covering the other members.
default-members = [".", "dyfj-repl", "dyfj-sandbox"]

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
dotenvy = "0.15.7"
rand = "0.10.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "mysql", "mysql-rsa", "chrono", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "macros"] }
ulid = "3.0.0"
